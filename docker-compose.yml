
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milesassist-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      redis:
        condition: service_healthy

  
  redis:
    image: redis:7-alpine
    container_name: milesassist-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


volumes:
  redis_data:
    name: milesassist_redis_data
